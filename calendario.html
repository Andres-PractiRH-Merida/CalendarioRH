<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario de eventos de RH · Plaza Mérida</title>
<meta name="description" content="Calendario mensual de eventos de Recursos Humanos en Mérida, Yucatán.">
<!-- Tipografía: Figtree (opcional; si no carga se usa la del sistema) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- La fuente carga sin bloquear la página: primero se ve con la tipografía del sistema y luego cambia -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"></noscript>
<style>
/* ========== 1. Tokens (sistema Organic) ========== */
:root{
  /* Paleta alineada con la portada: rojo y amarillo OXXO sobre blanco */
  --bg:#ffffff; --surface:#ffffff; --soft:#f6f4f1; --text:#2b2b2b; --muted:#5f5f5f; --line:#e6e3df;
  --accent:#c8001e; --accent-600:#9d0017; --accent-700:#a30019; --accent-100:#fdecee;
  --yellow:#ffc709;
  --font-h:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px; --pill:999px;
  --sh-sm:0 1px 4px rgba(0,0,0,.10); --sh-lg:0 18px 50px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--font-b);overflow-x:hidden}
a{color:var(--accent-700)} a:hover{color:var(--accent-600)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-100)}
/* Panel de ubicación */
.dia-cuerpo{display:grid;gap:16px;align-items:start}
.ubic{display:grid;gap:12px;margin:0 0 24px;padding:16px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-sm);min-width:0}
.ubic h3{font:800 1.2rem/1.2 var(--font-h);margin:0}
.ubic h4{font:800 1rem/1.2 var(--font-h);margin:0;overflow-wrap:anywhere}
.ubic .foto{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;background:var(--soft)}
.ubic .mapa{width:100%;aspect-ratio:4/3;border:0;border-radius:12px;display:block;background:var(--soft)}
.ubic address{font-style:normal;font-size:.92rem;overflow-wrap:anywhere}
.ubic .acc{display:grid;gap:8px;justify-items:start}
.ubic .ruta{font-weight:600;color:var(--accent-700);overflow-wrap:anywhere}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ========== 2. Marco vertical 9:16 (pensado para celular) ========== */
html,body{height:100%}
body{background:var(--soft);display:flex;justify-content:center}
.app{width:100%;max-width:560px;height:100dvh;overflow-y:auto;overflow-x:hidden;background:var(--bg);position:relative;-webkit-overflow-scrolling:touch}
@media (min-width:600px){.app{box-shadow:var(--sh-lg)}}
.chip{display:none}
.pad{padding:0 14px}
header.top{padding:12px 0 8px;border-top:6px solid var(--accent);box-shadow:inset 0 -0px 0 var(--yellow)}
.top .pad{display:flex;gap:8px;align-items:center;justify-content:space-between}
h1{font:800 1.05rem/1.2 var(--font-h);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--pill);cursor:pointer;text-decoration:none;color:var(--text);font-weight:600;font-size:.92rem;transition:background .15s;touch-action:manipulation;white-space:nowrap}
.btn:hover{background:var(--accent-100);color:var(--text)}
.btn:active{background:#f9c9d0}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-600);border-color:var(--accent-600);color:#fff}
.btn-sm{min-height:36px;padding:0 12px;font-size:.8rem}

/* ========== 4. Calendario ========== */
.bar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}
.bar .btn{padding:0;width:44px}
#hoy{width:auto;padding:0 14px}
#mes{font:800 1.25rem/1.1 var(--font-h);margin:0;flex:1;text-align:center}
details.fil{margin-bottom:10px}
details.fil summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:var(--pill);border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem}
details.fil summary::-webkit-details-marker{display:none}
details.fil[open] summary{background:var(--accent-100);border-color:var(--accent)}
.filters{display:grid;gap:10px;padding-top:10px}
.field label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin:0 0 3px 14px}
.input{width:100%;min-height:44px;padding:0 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--pill);font-size:16px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
.input:hover{border-color:var(--accent)}
.cal{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-sm);overflow:hidden}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:8px 0;text-align:center;font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.day{min-height:60px;padding:4px 2px;border-top:1px solid var(--line);border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;cursor:default;touch-action:manipulation}
.day:nth-child(7n+1){border-left:0}
.day.con{cursor:pointer}
.day.con:hover{background:var(--accent-100)}
.day.con:active{background:var(--accent-100)}
.day.fuera{background:var(--soft);color:#8a8a8a}
.num{min-width:26px;height:26px;display:grid;place-items:center;border-radius:var(--pill);font-weight:600;font-size:.85rem}
.day.hoy .num{background:var(--accent);color:#fff;font-weight:800;box-shadow:0 0 0 2px var(--yellow)}
.evs{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:center}
.pt{width:9px;height:9px;border-radius:50%;display:block}
.mas{font-size:.64rem;font-weight:700;color:var(--accent-700);line-height:1}
.leyenda{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted);margin:12px 0 0;padding:0;list-style:none}
.leyenda i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.aviso{padding:16px;margin-top:12px;background:var(--surface);border-radius:var(--r);text-align:center;color:var(--muted);font-size:.9rem}
.error{background:#fdecee;color:#7a0014;border-radius:var(--r);padding:18px;margin:12px 0;font-weight:500}
.tag{display:inline-block;padding:2px 10px;border-radius:var(--pill);font-size:.76rem;font-weight:700}
.tag.m{background:var(--soft);color:#3d3d3d}

/* ========== 5. Página del día (agenda completa) ========== */
.dia-h{display:flex;flex-direction:column;gap:10px;margin:8px 0 14px;align-items:flex-start}
.dia-h h2{font:800 1.5rem/1.15 var(--font-h);margin:0}
.dia-h p{margin:0;color:var(--muted);font-size:.9rem}
.agenda{list-style:none;margin:0;padding:0 0 24px;display:grid;gap:12px}
.ev{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-sm);padding:16px;display:grid;gap:8px}
.ev .hora{font-weight:700;color:var(--accent-700)}
.ev h3{font:800 1.2rem/1.2 var(--font-h);margin:0;overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.92rem}
dt{font-weight:700;color:var(--muted)}
dd{margin:0;overflow-wrap:anywhere}
.ev p{margin:0;overflow-wrap:anywhere;font-size:.95rem}
.ev .btn{justify-self:start}
/* Panel de ubicación */
.dia-cuerpo{display:grid;gap:16px;align-items:start}
.ubic{display:grid;gap:12px;margin:0 0 24px;padding:16px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-sm);min-width:0}
.ubic h3{font:800 1.2rem/1.2 var(--font-h);margin:0}
.ubic h4{font:800 1rem/1.2 var(--font-h);margin:0;overflow-wrap:anywhere}
.ubic .foto{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;background:var(--soft)}
.ubic .mapa{width:100%;aspect-ratio:4/3;border:0;border-radius:12px;display:block;background:var(--soft)}
.ubic address{font-style:normal;font-size:.92rem;overflow-wrap:anywhere}
.ubic .acc{display:grid;gap:8px;justify-items:start}
.ubic .ruta{font-weight:600;color:var(--accent-700);overflow-wrap:anywhere}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer{padding:20px 14px 32px;color:var(--muted);font-size:.85rem}
/* Escritorio: diseño ancho */
@media (min-width:900px){
.app{max-width:1120px}.pad{padding:0 32px}
h1{font-size:1.4rem}header.top{padding:20px 0 10px}
.day{min-height:108px;align-items:stretch;padding:6px 6px;gap:4px}
.num{align-self:flex-start}
.pt{display:none}
.evs{flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:3px}
.chip{display:block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:var(--pill);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mas{text-align:left;font-size:.74rem;padding-left:4px}
.dow div{font-size:.78rem}
.filters{grid-template-columns:2fr 1fr 1fr}
.dia-cuerpo.con-ubic{grid-template-columns:minmax(0,1fr) 380px}.dia-cuerpo:not(.con-ubic) .agenda{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.ubic{position:sticky;top:12px}
#vista-cal .bar{max-width:520px;margin-left:auto;margin-right:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top"><div class="pad">
  <h1>Calendario de eventos de RH · Plaza Mérida</h1>
  <a class="btn btn-sm" href="index.html">← Volver al inicio</a>
</div></header>

<main class="pad">
  <!-- Vista: calendario mensual -->
  <section id="vista-cal" aria-label="Calendario mensual">
    <div class="bar" role="group" aria-label="Navegación de mes">
      <button class="btn" id="prev" type="button" aria-label="Mes anterior">‹</button>
      <h2 id="mes" aria-live="polite"></h2>
      <button class="btn" id="next" type="button" aria-label="Mes siguiente">›</button>
    </div>
    <div class="bar" style="justify-content:flex-end;margin-top:-4px"><button class="btn btn-sm" id="hoy" type="button">Hoy</button></div>
    <details class="fil" id="fil"><summary>Filtros y búsqueda</summary>
      <form class="filters" role="search" aria-label="Filtros de eventos" onsubmit="return false">
        <div class="field"><label for="f-q">Buscar</label><input class="input" id="f-q" type="search" placeholder="Título u organizador" autocomplete="off"></div>
        <div class="field"><label for="f-cat">Categoría</label>
          <select class="input" id="f-cat"><option value="">Todas</option></select></div>
        <div class="field"><label for="f-mod">Modalidad</label>
          <select class="input" id="f-mod"><option value="">Todas</option><option value="presencial">Presencial</option><option value="virtual">Virtual</option><option value="hibrido">Híbrido</option></select></div>
      </form>
    </details>
    <div class="cal">
      <div class="dow" aria-hidden="true"><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div></div>
      <div class="grid" id="grid"></div>
    </div>
    <ul class="leyenda" id="leyenda" aria-label="Colores por categoría"></ul>
    <p class="leyenda" style="margin-top:8px">Toca un día para ver su agenda completa.</p>
  </section>

  <!-- Vista: agenda de un día -->
  <section id="vista-dia" aria-label="Agenda del día" hidden></section>

  <div id="estado" role="status"></div>
</main>

<footer><span id="actualizado">Última actualización: …</span></footer>
</div>
<script>
/* ========== Configuración ========== */
const DATA_URL = 'data/eventos.json';
/* Las categorías se leen del JSON; cada una recibe un color de esta paleta (fondo, texto, punto) */
const PALETA = [['#fbd5da','#7a0014','#c8001e'],['#ffefb0','#5c4600','#e6ab00'],['#d3e2f5','#17406e','#2f6db5'],['#d4ecd9','#1d4d2a','#2e8a47'],['#e5d9f2','#43256b','#7b4bb5'],['#fde0c8','#6b3300','#d9701c'],['#d2eeee','#0f4a4a','#1f9494'],['#e8e6e3','#3d3d3d','#8a8a8a']];
let CATS = {};
const MODS = {presencial:'Presencial',virtual:'Virtual',hibrido:'Híbrido'};
const MAX_PUNTOS = 3;   // puntos de color por día; el resto se indica con "+N más"

/* ========== Estado ========== */
let eventos = [];
const hoy = new Date();
let cur = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
let ruta = {v:'calendario'};            // {v:'calendario'|'dia', dia?}
const $ = id => document.getElementById(id);

/* ========== Utilidades ========== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const fechaLarga = s => parse(s).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const horario = e => e.hora_inicio ? (e.hora_fin ? e.hora_inicio+' – '+e.hora_fin+' h' : e.hora_inicio+' h') : 'Todo el día';
const slug = s => String(s||'otro').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'otro';
const cat = e => slug(e.categoria);
/* Crea filtro, leyenda y colores a partir de las categorías presentes en los datos */
function prepararCategorias(){
  CATS = {};
  eventos.forEach(e => { const k = cat(e); if(!CATS[k]){ const t = String(e.categoria||'Otro').trim(); CATS[k] = t.charAt(0).toUpperCase()+t.slice(1); } });
  const claves = Object.keys(CATS).sort((a,b)=>CATS[a].localeCompare(CATS[b],'es'));
  let css = '';
  claves.forEach((k,n) => { const p = PALETA[n % PALETA.length];
    css += '.cat-'+k+'{background:'+p[0]+';color:'+p[1]+'}.pt.cat-'+k+'{background:'+p[2]+'}.dot-'+k+'{background:'+p[2]+'}'; });
  let st = $('cat-estilos'); if(!st){ st = document.createElement('style'); st.id = 'cat-estilos'; document.head.appendChild(st); }
  st.textContent = css;
  $('f-cat').innerHTML = '<option value="">Todas</option>' + claves.map(k => '<option value="'+k+'">'+esc(CATS[k])+'</option>').join('');
  $('leyenda').innerHTML = claves.map(k => '<li><i class="dot-'+k+'"></i>'+esc(CATS[k])+'</li>').join('');
}
const validFecha = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parse(s));
const porHora = (a,b) => (a.fecha+(a.hora_inicio||'99:99')).localeCompare(b.fecha+(b.hora_inicio||'99:99'));

/* ========== Eventos recurrentes ==========
   recurrencia: { dia_semana, desde, hasta, excepciones? } — dia_semana: nombre en español ("martes") o número 1 (lunes) a 7 (domingo).
   "excepciones" (lista de AAAA-MM-DD) puede ir dentro de recurrencia o al nivel del evento. */
const DIAS = {lunes:1,martes:2,miercoles:3,jueves:4,viernes:5,sabado:6,domingo:7};
function numDia(v){
  if(typeof v==='number') return v>=1 && v<=7 ? v : 0;
  const s = String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return DIAS[s] || (/^[1-7]$/.test(s) ? +s : 0);
}
function expandir(lista){
  const out = [];
  lista.forEach(e => {
    if(!e || !e.id || !e.titulo) return;
    const rc = e.recurrencia;
    if(!rc){ if(validFecha(e.fecha)) out.push(e); return; }
    const dia = numDia(rc.dia_semana);
    if(!dia || !validFecha(rc.desde) || !validFecha(rc.hasta)) return;
    const ex = new Set([].concat(rc.excepciones||[], e.excepciones||[]));
    const fin = parse(rc.hasta);
    let d = parse(rc.desde);
    d.setDate(d.getDate() + ((dia - (d.getDay()||7) + 7) % 7));   // primer día de la semana indicado
    for(let n=0; d<=fin && n<400; n++, d.setDate(d.getDate()+7)){
      const f = iso(d);
      if(!ex.has(f)) out.push({...e, fecha:f, id:e.id+'@'+f});
    }
  });
  return out;
}

/* ========== Ubicaciones (data/ubicaciones.json, opcional) ========== */
const UBIC_URL = 'data/ubicaciones.json';
let UBIC = {};                       // llave normalizada -> {nombre, ...datos}
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
async function cargarUbicaciones(){
  try{
    const r = await fetch(UBIC_URL, {cache:'no-cache'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    UBIC = {};
    Object.keys(j||{}).forEach(n => { if(j[n] && typeof j[n]==='object') UBIC[norm(n)] = {...j[n], nombre:n}; });
    if(ruta.v==='dia') renderDia();
  }catch(err){ console.warn('Ubicaciones no disponibles:', err); UBIC = {}; }   // el calendario sigue sin el panel
}
/* Extrae el src del iframe guardado en el JSON y solo acepta mapas de Google (evita inyectar HTML arbitrario) */
function srcMapa(emb){
  const m = /src\s*=\s*["']([^"']+)["']/i.exec(emb||'');
  return m && /^https:\/\/www\.google\.com\/maps\/embed/i.test(m[1]) ? m[1] : '';
}
function panelUbicacion(u){
  const src = srcMapa(u.mapa_embed), dir = u.direccion || '';
  return '<section class="ubic" aria-label="Ubicación: '+esc(u.nombre)+'"><h3>Ubicación</h3><h4>'+esc(u.nombre)+'</h4>'+
    (u.foto ? '<img class="foto" src="'+esc(u.foto)+'" alt="Fachada de '+esc(u.nombre)+'" loading="lazy">' : '')+
    (src ? '<iframe class="mapa" src="'+esc(src)+'" title="Mapa de '+esc(u.nombre)+'" loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>' : '')+
    (dir ? '<address>'+esc(dir)+'</address>' : '')+
    '<div class="acc">'+
    (/^https?:\/\//i.test(u.maps_url||'') ? '<a class="btn btn-primary" href="'+esc(u.maps_url)+'" target="_blank" rel="noopener noreferrer">Abrir en Maps<span class="sr-only"> (se abre en una pestaña nueva)</span></a>' : '')+
    (dir ? '<a class="ruta" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(u.coordenadas||dir)+'" target="_blank" rel="noopener noreferrer">Ver ruta a '+esc(u.nombre)+'<span class="sr-only"> (se abre en una pestaña nueva)</span></a>' : '')+
    '</div></section>';
}
/* Si la foto no carga, se oculta sin afectar el resto */
document.addEventListener('error', ev => { if(ev.target.matches && ev.target.matches('.ubic .foto')) ev.target.remove(); }, true);

/* ========== Carga de datos ========== */
async function cargar(){
  try{
    const r = await fetch(DATA_URL, {cache:'no-cache'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if(!j || !Array.isArray(j.eventos)) throw new Error('Formato inválido: falta la lista "eventos".');
    eventos = expandir(j.eventos).sort(porHora);
    let act = 'sin fecha';
    if(validFecha(j.actualizado)) act = fechaLarga(j.actualizado);
    else if(j.actualizado) act = String(j.actualizado);
    $('actualizado').textContent = 'Última actualización: ' + act;
    prepararCategorias();
    render();
  }catch(err){
    console.error(err);
    $('estado').innerHTML = '<div class="error" role="alert">No se pudieron cargar los eventos. Verifica tu conexión e inténtalo de nuevo más tarde. Si el problema continúa, el archivo de datos podría estar dañado.</div>';
    $('actualizado').textContent = 'Última actualización: no disponible';
  }
}

/* ========== Filtros ========== */
function filtrados(){
  const q = $('f-q').value.trim().toLowerCase(), c = $('f-cat').value, m = $('f-mod').value;
  return eventos.filter(e =>
    (!c || cat(e)===c) && (!m || e.modalidad===m) &&
    (!q || (e.titulo||'').toLowerCase().includes(q) || (e.organizador||'').toLowerCase().includes(q)));
}

/* ========== Navegación entre vistas (hash: #calendario, #dia/AAAA-MM-DD) ========== */
function leerRuta(){
  const h = location.hash.slice(1);
  if(h.startsWith('dia/') && validFecha(h.slice(4))) return {v:'dia', dia:h.slice(4)};
  return {v:'calendario'};
}
function ir(hash){ location.hash = hash; }
window.addEventListener('hashchange', () => { ruta = leerRuta(); render(true); });

/* ========== Render ========== */
function render(reset){
  const v = ruta.v;
  $('vista-cal').hidden = v!=='calendario';
  $('vista-dia').hidden = v!=='dia';
  if(v==='calendario') renderCal();
  if(v==='dia') renderDia();
  if(reset===true) $('app').scrollTop = 0;
}

function renderCal(){
  const lista = filtrados(), mapa = {};
  lista.forEach(e => (mapa[e.fecha] ||= []).push(e));
  $('mes').textContent = cap(cur.toLocaleDateString('es-MX',{month:'long',year:'numeric'}));
  const offset = (new Date(cur.getFullYear(), cur.getMonth(), 1).getDay()+6)%7;   // lunes = 0
  const inicio = new Date(cur.getFullYear(), cur.getMonth(), 1-offset);
  const semanas = Math.ceil((offset + new Date(cur.getFullYear(), cur.getMonth()+1, 0).getDate())/7);
  let h = '', delMes = 0;
  for(let i=0;i<semanas*7;i++){
    const d = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate()+i);
    const k = iso(d), evs = mapa[k]||[], dentro = d.getMonth()===cur.getMonth();
    if(dentro) delMes += evs.length;
    const label = fechaLarga(k)+(k===iso(hoy)?' (hoy)':'')+', '+(evs.length ? evs.length+(evs.length===1?' evento':' eventos') : 'sin eventos');
    const cls = 'day'+(dentro?'':' fuera')+(k===iso(hoy)?' hoy':'')+' con';
    const attrs = ' role="button" tabindex="0" data-dia="'+k+'"';
    h += '<div class="'+cls+'"'+attrs+' aria-label="'+esc(label)+'"><span class="num">'+d.getDate()+'</span><div class="evs">';
    evs.slice(0,MAX_PUNTOS).forEach(e => { h += '<i class="pt cat-'+cat(e)+'"></i><span class="chip cat-'+cat(e)+'">'+esc(e.titulo)+'</span>'; });
    if(evs.length>MAX_PUNTOS) h += '<span class="mas">+'+(evs.length-MAX_PUNTOS)+' más</span>';
    h += '</div></div>';
  }
  $('grid').innerHTML = h;
  $('estado').innerHTML = eventos.length && !delMes ? '<div class="aviso">No hay eventos este mes con los filtros actuales.</div>' : '';
}

function renderDia(){
  const k = ruta.dia, evs = filtrados().filter(e => e.fecha===k).sort(porHora);
  const ubics = [], vistos = new Set();   // ubicaciones conocidas entre los eventos del día
  evs.forEach(e => { const u = UBIC[norm(e.lugar)]; if(u && !vistos.has(u.nombre)){ vistos.add(u.nombre); ubics.push(u); } });
  const fila = (t,v) => v ? '<dt>'+t+'</dt><dd>'+esc(v)+'</dd>' : '';
  $('estado').innerHTML = '';
  $('vista-dia').innerHTML =
    '<div class="dia-h"><button type="button" class="btn btn-sm" data-volver>← Calendario</button>'+
    '<h2>'+esc(cap(fechaLarga(k)))+'</h2><p>'+(evs.length ? evs.length+(evs.length===1?' evento':' eventos') : (eventos.some(e => e.fecha===k) ? 'No hay eventos este día con los filtros actuales.' : 'No hay eventos programados este día.'))+'</p></div>'+
    '<div class="dia-cuerpo'+(ubics.length?' con-ubic':'')+'"><ul class="agenda">'+evs.map(e =>
      '<li class="ev"><span class="hora">'+esc(horario(e))+'</span><h3>'+esc(e.titulo)+'</h3>'+
      '<div class="tags"><span class="tag cat-'+cat(e)+'">'+CATS[cat(e)]+'</span><span class="tag m">'+esc(MODS[e.modalidad]||'Modalidad por confirmar')+'</span></div>'+
      '<dl>'+fila('Lugar',e.lugar)+fila('Organizador',e.organizador)+'</dl>'+
      (e.descripcion ? '<p>'+esc(e.descripcion)+'</p>' : '')+
      (/^https?:\/\//i.test(e.url||'') ? '<a class="btn btn-primary" href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer">Ver más información<span class="sr-only"> (se abre en una pestaña nueva)</span></a>' : '')+
      '</li>').join('')+'</ul>'+ubics.map(panelUbicacion).join('')+'</div>';
}

/* ========== Eventos de la interfaz ========== */
document.addEventListener('click', ev => {
  const t = ev.target;
  if(t.closest('[data-volver]')) return history.length>1 ? history.back() : ir('calendario');
  const d = t.closest('[data-dia]'); if(d) ir('dia/'+d.dataset.dia);
});
document.addEventListener('keydown', ev => {
  if((ev.key==='Enter'||ev.key===' ') && ev.target.matches('.day.con')){ ev.preventDefault(); ir('dia/'+ev.target.dataset.dia); }
});
$('prev').onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth()-1, 1); render(); };
$('next').onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1); render(); };
$('hoy').onclick  = () => { cur = new Date(hoy.getFullYear(), hoy.getMonth(), 1); render(); };
['f-q','f-cat','f-mod'].forEach(id => $(id).addEventListener('input', () => render()));

ruta = leerRuta();
if(ruta.v==='dia') cur = new Date(parse(ruta.dia).getFullYear(), parse(ruta.dia).getMonth(), 1);
cargar();
cargarUbicaciones();
render();
</script>
</body>
</html>
